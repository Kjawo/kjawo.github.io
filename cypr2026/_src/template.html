<!doctype html>
<html lang="pl">

    {{NAV}}

      {{WEEK}}

      {{ROUTES}}
      {{MAP}}
      {{PRACTICE}}
      {{CHECKLISTS}}

      {{FOOTER}}
    </footer>
  </div>

  <script type="application/json" id="cypr-data">{{DATA_JSON}}</script>
  <script src="app.js?v={{HASH}}" defer data-version="{{HASH}}"></script>
